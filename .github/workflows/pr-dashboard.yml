name: PR Dashboard

# Keeps one "Operator dashboard" issue current: every open PR as a stack,
# its CI and Safety Guard result, the review label, and the next action.
#
# pull_request_target, workflow_run, and schedule all run this file as it
# exists on the default branch, so a PR cannot rewrite the dashboard script.
# SECURITY: never check out or execute PR code here. The script reads PR
# data, workflow runs, and file lists from the API and treats every
# PR-controlled string (titles, bodies, branch and file names) as untrusted.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  pull_request_target:
    types: [ opened, reopened, synchronize, closed, labeled, unlabeled, ready_for_review, converted_to_draft, edited ]
  workflow_run:
    workflows: [ "Growin Backend CI", "Safety Guard" ]
    types: [ completed ]

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

# One writer at a time. A newer pending run replaces an older pending one,
# which is fine: each run rebuilds the whole dashboard from the API.
concurrency:
  group: pr-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    name: Operator dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the dashboard files from the default branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/pr_dashboard.py
            .github/scripts/pr_impact.py
            .github/safety-paths.txt
          sparse-checkout-cone-mode: false

      - name: Update the dashboard issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          trigger="$EVENT"
          if [[ -n "$PR_NUMBER" ]]; then trigger="$EVENT ($ACTION #$PR_NUMBER)"; fi
          if [[ -n "$WORKFLOW" ]]; then trigger="$EVENT ($WORKFLOW)"; fi
          python3 -I .github/scripts/pr_dashboard.py update \
            --repo "$REPO" --trigger "$trigger" --run-id "$RUN_ID" \
            --safety-paths .github/safety-paths.txt \
            --out "$RUNNER_TEMP/dashboard.md"
          cat "$RUNNER_TEMP/dashboard.md" >> "$GITHUB_STEP_SUMMARY"
