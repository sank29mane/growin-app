name: Growin Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run SOTA Test Suite
    runs-on: macos-latest
    timeout-minutes: 20
    
    env:
      CI: "true"
      GROWIN_ANALYTICS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --project backend --all-groups

      - name: Run SOTA Unit & Integration Tests
        timeout-minutes: 10
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          mkdir -p pr-impact
          uv run --project backend pytest tests/backend/ \
            --junitxml=pr-impact/tests-junit.xml \
            --cov --cov-config=.github/pr-impact.coveragerc \
            --cov-report=json:pr-impact/coverage.json

      - name: Run Performance Benchmarks
        timeout-minutes: 5
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          uv run --project backend pytest tests/backend/test_performance_benchmarks.py \
            --junitxml=pr-impact/bench-junit.xml

      # Reduce the raw reports to one small metrics.json. The PR Impact
      # workflow reads only this file, never the raw reports.
      - name: Collect PR impact metrics
        if: always()
        run: |
          python3 -I .github/scripts/pr_impact.py collect \
            --junit pr-impact/tests-junit.xml \
            --bench-junit pr-impact/bench-junit.xml \
            --coverage pr-impact/coverage.json \
            --out pr-impact/metrics.json

      - name: Upload PR impact metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-impact-metrics
          path: pr-impact/metrics.json
          retention-days: 30
          if-no-files-found: ignore

      - name: DeepEval Reasoning Audit
        run: |
          # Placeholder for DeepEval logic
          echo "Executing Reasoning Trace Audit..."
