name: Swift CI

# ADVISORY. Not a required check. Builds the macOS app and runs the
# GrowinTests unit tests on a GitHub macOS runner with the newest Xcode it
# has. GrowinUITests are skipped. Secure Enclave and Touch ID UAT tests stay
# skipped because TEST_RUNNER_GROWIN_SE_UAT is never set here.
#
# The operator builds with Xcode-beta. When the runner only has an older SDK
# and the build fails the way an SDK gap fails (missing module, member, or
# symbol), the job ends with a warning and a step summary saying what is
# missing instead of a red X. A failure on an SDK at least as new as
# KNOWN_GOOD_SDK is a real failure.
on:
  pull_request:
    branches: [ main ]
    paths:
      - "Growin/**"
      - "GrowinTests/**"
      - "Growin.xcodeproj/**"
      - ".github/workflows/swift-ci.yml"
  push:
    branches: [ main ]
    paths:
      - "Growin/**"
      - "GrowinTests/**"
      - "Growin.xcodeproj/**"
      - ".github/workflows/swift-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Swift unit tests (advisory)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # The SDK the project is verified to build with (Xcode 27.0 beta,
      # macOS 27.0 SDK, 2026-10-08). Raise it when the project adopts newer APIs.
      KNOWN_GOOD_SDK: "27.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select the newest Xcode on the runner
        id: xcode
        run: |
          set -euo pipefail
          best=""; best_ver="0"
          for app in /Applications/Xcode*.app; do
            [[ -d "$app" && ! -L "$app" ]] || continue
            ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/version.plist" 2>/dev/null || echo 0)
            echo "Found $app ($ver)"
            top=$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -n 1)
            if [[ "$top" == "$ver" && "$ver" != "$best_ver" ]]; then best="$app"; best_ver="$ver"; fi
          done
          if [[ -z "$best" ]]; then echo "::error::No Xcode found in /Applications."; exit 1; fi
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$best/Contents/Developer"
          echo "Selected $best"
          xcodebuild -version
          sdk=$(xcodebuild -version -sdk macosx SDKVersion)
          echo "macOS SDK $sdk"
          older=false
          if [[ "$(printf '%s\n%s\n' "$sdk" "$KNOWN_GOOD_SDK" | sort -V | head -n 1)" != "$KNOWN_GOOD_SDK" ]]; then older=true; fi
          {
            echo "app=$(basename "$best")"
            echo "version=$best_ver"
            echo "sdk=$sdk"
            echo "older_sdk=$older"
          } >> "$GITHUB_OUTPUT"
          echo "Project: $(grep -m1 -o 'objectVersion = [0-9]*' Growin.xcodeproj/project.pbxproj), $(grep -m1 -o 'MACOSX_DEPLOYMENT_TARGET = [0-9.]*' Growin.xcodeproj/project.pbxproj), $(grep -m1 -o 'LastUpgradeCheck = [0-9]*' Growin.xcodeproj/project.pbxproj)"

      - name: Build for testing
        id: build
        env:
          OLDER_SDK: ${{ steps.xcode.outputs.older_sdk }}
          SDK: ${{ steps.xcode.outputs.sdk }}
          XCODE: ${{ steps.xcode.outputs.app }}
        run: |
          set -uo pipefail
          xcodebuild build-for-testing \
            -project Growin.xcodeproj -scheme Growin \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [[ $status -eq 0 ]]; then echo "built=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "built=false" >> "$GITHUB_OUTPUT"
          gap='no such module|has no member|cannot find (type )?.* in scope|is only available in macOS|is unavailable in macOS|future Xcode project file format|requires a newer version of Xcode|unable to find a destination'
          if [[ "$OLDER_SDK" == "true" ]] && grep -Eq "$gap" "$RUNNER_TEMP/build.log"; then
            missing=$(grep -E "error:.*($gap)" "$RUNNER_TEMP/build.log" | sed -E 's/^.*error: //' | sort -u | head -n 8)
            echo "::warning::Swift CI skipped: the runner's newest Xcode is $XCODE with the macOS $SDK SDK, and the project needs the macOS $KNOWN_GOOD_SDK SDK or newer. Not a code failure."
            {
              echo "## Swift CI: degraded (advisory)"
              echo
              echo "The runner's newest Xcode is \`$XCODE\` with the macOS \`$SDK\` SDK."
              echo "The project is verified with the macOS \`$KNOWN_GOOD_SDK\` SDK (Xcode-beta). The build failed on APIs the older SDK does not have, so tests were not run."
              echo
              echo "First missing symbols:"
              echo
              echo '```'
              echo "$missing"
              echo '```'
              echo
              echo "Nothing to fix in the code. This clears once GitHub ships a macOS runner with a new enough Xcode."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Swift build failed on Xcode $XCODE (macOS $SDK SDK). See the log above."
          exit 1

      - name: Run GrowinTests
        id: test
        if: steps.build.outputs.built == 'true'
        run: |
          set -uo pipefail
          unset TEST_RUNNER_GROWIN_SE_UAT
          xcodebuild test-without-building \
            -project Growin.xcodeproj -scheme Growin \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/GrowinTests.xcresult" \
            -only-testing:GrowinTests \
            -skip-testing:GrowinUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Summarise
        if: always() && steps.build.outputs.built == 'true'
        env:
          SDK: ${{ steps.xcode.outputs.sdk }}
          XCODE: ${{ steps.xcode.outputs.app }}
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          {
            echo "## Swift CI: ${OUTCOME} (advisory)"
            echo
            echo "Xcode \`$XCODE\`, macOS SDK \`$SDK\`. Unit tests: GrowinTests only."
          } >> "$GITHUB_STEP_SUMMARY"
          result="$RUNNER_TEMP/GrowinTests.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result" > "$RUNNER_TEMP/summary.json" 2>/dev/null || true
            python3 -I -c '
          import json, sys
          try:
              s = json.load(open(sys.argv[1]))
          except Exception:
              sys.exit(0)
          keys = ("result", "totalTestCount", "passedTests", "failedTests", "skippedTests", "expectedFailures")
          print("\n" + " · ".join(f"{k}: {s[k]}" for k in keys if k in s))
          ' "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-ci-results
          path: |
            ${{ runner.temp }}/GrowinTests.xcresult
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
          retention-days: 14
          if-no-files-found: ignore
