name: Swift CI

# REQUIRED check: "Swift unit tests". Builds the macOS app and runs the
# GrowinTests unit tests on a GitHub macOS runner with the newest Xcode it
# has. GrowinUITests are not run here, but a change under GrowinUITests/
# triggers the job because GrowinTests hold source scans over that folder.
# GrowinTests also read tests/backend/fixtures/relay_orders/ (the relay
# signing vectors, through RelayVectors), so a change there triggers the job
# too. A test scans GrowinTests for other paths outside the three Swift
# folders and fails if one is not in the list below.
# The step "Require the Keychain tripwire and canary tests" fails the job unless
# every test named in .github/required-swift-tests.txt both ran and passed in
# the xcresult, so deleting, renaming, disabling or skipping one cannot go
# green. Editing that list also triggers this job.
# Secure Enclave and Touch ID UAT tests stay skipped because
# TEST_RUNNER_GROWIN_SE_UAT is never set here.
#
# How skipping works. GitHub leaves a required check "Expected" forever when
# its workflow never starts, which is what a `paths:` filter on pull_request
# does. So this workflow starts on EVERY pull request to main. A cheap ubuntu
# job (`changes`) runs `git diff --name-only` against the PR base to see
# whether any Swift-relevant file changed. The macOS job `needs: changes`.
# When nothing relevant changed, the macOS job is skipped by its `if:`, and
# GitHub reports a job skipped by a conditional as success, which satisfies
# the required check. The job name stays "Swift unit tests" on both paths.
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks
#
# Fail closed. The macOS job is skipped only when `changes` succeeded AND said
# swift=false. If the diff cannot be computed, if `changes` itself fails, or
# if its output is empty, the macOS job runs.
#
# The `push` trigger keeps its path filter. No required check applies to a
# push, so a backend-only merge to main need not spend a macOS runner. Keep
# its paths in step with the detection globs below (a test checks this).
# Detection matches case-insensitively (:(icase)); GitHub's push path filter
# cannot, so the two lists are compared with that prefix removed.
#
# `pull_request` keeps the default activity types (opened, synchronize,
# reopened). `edited` is left out on purpose: it also fires on every title and
# body edit, and this workflow's concurrency group cancels the in-flight run
# of the same PR, so a body edit would kill a running 45-minute macOS job and
# start it again. A stacked PR retargeted to main gets its run from the push
# that the stack flow already requires (rebase, then force-push), or from a
# close and reopen.
#
# The operator builds with Xcode-beta. If the project adopts APIs newer than
# the runner's SDK, raise MIN_SDK. Then, when the runner's SDK is older than
# MIN_SDK and the MESSAGE of every error line (the text after "error: ") is
# one a newer SDK fixes ("... is only available in macOS N or newer", or an
# explicit Xcode or SDK version error), the build step writes a warning and a
# step summary saying what is missing, and then FAILS: the tests did not run,
# so a required check must not be green. Anything else keeps it red as well:
# "cannot find ... in scope", syntax errors, mixed logs, and plain
# "is unavailable in macOS" (@available(macOS, unavailable) is permanent).
# On an SDK at least MIN_SDK, every build or test failure is red.
#
# SDK degrade override. If the repository variable SWIFT_CI_ALLOW_SDK_DEGRADE
# is exactly the string "true" (not TRUE, 1, empty or unset), the SDK-gap case
# above ends green instead, with a loud warning that the tests did NOT run.
# Only the operator can set a repository variable, and nothing in a PR (label,
# commit message, repo file) can turn it on. It is meant to be temporary:
#   gh variable set SWIFT_CI_ALLOW_SDK_DEGRADE --body true
#   gh variable delete SWIFT_CI_ALLOW_SDK_DEGRADE
# It never rescues a non-availability error or a build on an SDK >= MIN_SDK.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - "Growin/**"
      - "GrowinTests/**"
      - "GrowinUITests/**"
      - "Growin.xcodeproj/**"
      - ".github/workflows/swift-ci.yml"
      - ".github/required-swift-tests.txt"
      - "tests/backend/fixtures/relay_orders/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Swift changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.detect.outputs.swift }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the PR base and head commits are both present for
          # a three-dot diff. The repo is small. No third-party action.
          fetch-depth: 0
          persist-credentials: false

      - name: Did any Swift-relevant file change?
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Every failure path below answers swift=true: when in doubt, run.
          run_swift() { echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Event $EVENT_NAME has no PR diff. Running the Swift job."
            run_swift
          fi
          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "::warning::PR base or head SHA missing. Running the Swift job."
            run_swift
          fi
          if ! files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" -- \
              ':(icase)Growin/**' \
              ':(icase)GrowinTests/**' \
              ':(icase)GrowinUITests/**' \
              ':(icase)Growin.xcodeproj/**' \
              ':(icase).github/workflows/swift-ci.yml' \
              ':(icase).github/required-swift-tests.txt' \
              ':(icase)tests/backend/fixtures/relay_orders/**'); then
            echo "::warning::Could not diff $BASE_SHA...$HEAD_SHA. Running the Swift job."
            run_swift
          fi
          if [[ -n "$files" ]]; then
            echo "Swift-relevant files changed:"
            echo "$files"
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Swift-relevant file changed. The Swift job will be skipped, which reports success."
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: Swift unit tests
    needs: changes
    # Skip only when `changes` succeeded and said swift=false. Anything else
    # (failed, empty output) runs. !cancelled() lets this job still evaluate
    # when `changes` failed; a bare `needs` would skip it instead.
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.swift == 'false') }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Lowest macOS SDK verified to build and pass GrowinTests: macos-latest,
      # Xcode 26.6, macOS 26.5 SDK, 2026-10-08 (86 passed). The operator's
      # Xcode-beta 27.0 (macOS 27.0 SDK) also passes locally.
      MIN_SDK: "26.5"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select the newest Xcode on the runner
        id: xcode
        run: |
          set -euo pipefail
          best=""; best_ver="0"
          for app in /Applications/Xcode*.app; do
            [[ -d "$app" && ! -L "$app" ]] || continue
            ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/version.plist" 2>/dev/null || echo 0)
            echo "Found $app ($ver)"
            top=$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -n 1)
            if [[ "$top" == "$ver" && "$ver" != "$best_ver" ]]; then best="$app"; best_ver="$ver"; fi
          done
          if [[ -z "$best" ]]; then echo "::error::No Xcode found in /Applications."; exit 1; fi
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$best/Contents/Developer"
          echo "Selected $best"
          xcodebuild -version
          sdk=$(xcodebuild -version -sdk macosx SDKVersion)
          echo "macOS SDK $sdk"
          older=false
          if [[ "$(printf '%s\n%s\n' "$sdk" "$MIN_SDK" | sort -V | head -n 1)" != "$MIN_SDK" ]]; then older=true; fi
          {
            echo "app=$(basename "$best")"
            echo "version=$best_ver"
            echo "sdk=$sdk"
            echo "older_sdk=$older"
          } >> "$GITHUB_OUTPUT"
          echo "Project: $(grep -m1 -o 'objectVersion = [0-9]*' Growin.xcodeproj/project.pbxproj), $(grep -m1 -o 'MACOSX_DEPLOYMENT_TARGET = [0-9.]*' Growin.xcodeproj/project.pbxproj), $(grep -m1 -o 'LastUpgradeCheck = [0-9]*' Growin.xcodeproj/project.pbxproj)"

      - name: Build for testing
        id: build
        env:
          OLDER_SDK: ${{ steps.xcode.outputs.older_sdk }}
          SDK: ${{ steps.xcode.outputs.sdk }}
          XCODE: ${{ steps.xcode.outputs.app }}
          # Operator-only switch (a repository variable). Read through env,
          # never inline in `run`. Anything but the exact string "true" is strict.
          ALLOW_SDK_DEGRADE: ${{ vars.SWIFT_CI_ALLOW_SDK_DEGRADE }}
        run: |
          set +e -uo pipefail  # the runner uses bash -e; keep going to read the status
          xcodebuild build-for-testing \
            -project Growin.xcodeproj -scheme Growin \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [[ $status -eq 0 ]]; then echo "built=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "built=false" >> "$GITHUB_OUTPUT"
          # Degrade only when every error MESSAGE is one a newer SDK fixes.
          # Diagnostics look like "path:LINE:COL: error: MESSAGE" or
          # "xcodebuild: error: MESSAGE". Matching only the message means a
          # file name cannot make a real error look like an SDK gap. The diag
          # prefix is greedy so the LAST ": error: " wins (paths may contain
          # colons), and the version phrase must end the message. A line with
          # more than one "error: " is never classified: extraction would keep
          # only the tail and could drop a real error, so it stays red. The
          # future-project-format phrase is not listed: real xcodebuild prints
          # "Unable to read project", so it never fired. Unknown means red.
          sdk_gap() {
            local line="$1" msg stripped
            stripped="${line//error: /}"
            (( ${#line} - ${#stripped} > 7 )) && return 1
            local diag='^.*:[0-9]+:[0-9]+: error: (.*)$'
            local tool='^(xcodebuild: )?error: (.*)$'
            local avail='^.+ is only available in macOS [0-9]+(\.[0-9]+)* or newer$'
            local version='^(.+ requires a newer version of Xcode\.?|SDK ".+" cannot be located\.?)$'
            if [[ "$line" =~ $diag ]]; then msg="${BASH_REMATCH[1]}"
            elif [[ "$line" =~ $tool ]]; then msg="${BASH_REMATCH[2]}"
            else return 1; fi
            [[ "$msg" =~ $avail || "$msg" =~ $version ]]
          }
          errors=$(grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u)
          all_gap=false
          if [[ -n "$errors" ]]; then
            all_gap=true
            while IFS= read -r line; do
              sdk_gap "$line" || { all_gap=false; break; }
            done <<< "$errors"
          fi
          if [[ "$OLDER_SDK" == "true" && "$all_gap" == "true" ]]; then
            missing=$(sed -E 's/^.*error: //' <<< "$errors" | sort -u | head -n 8)
            # Strict by default. Only the exact string "true" (not TRUE, 1,
            # empty or unset) turns the degrade into a green warning. The
            # value is a repository variable, which only the operator sets.
            override=false
            if [[ "${ALLOW_SDK_DEGRADE:-}" == "true" ]]; then override=true; fi
            loud="tests did NOT run; SDK degrade override is ON (repo variable SWIFT_CI_ALLOW_SDK_DEGRADE)"
            if [[ "$override" == "true" ]]; then
              echo "::warning::Swift CI skipped: $loud. The runner's newest Xcode is $XCODE with the macOS $SDK SDK, and the project needs the macOS $MIN_SDK SDK or newer. Not a code failure."
            else
              echo "::warning::Swift CI skipped: the runner's newest Xcode is $XCODE with the macOS $SDK SDK, and the project needs the macOS $MIN_SDK SDK or newer. Not a code failure."
            fi
            {
              echo "## Swift CI: degraded"
              echo
              echo "The runner's newest Xcode is \`$XCODE\` with the macOS \`$SDK\` SDK."
              echo "The project needs the macOS \`$MIN_SDK\` SDK or newer. The build failed on APIs the older SDK does not have, so tests were not run."
              echo
              echo "First missing symbols:"
              echo
              echo '```'
              echo "$missing"
              echo '```'
              echo
              if [[ "$override" == "true" ]]; then
                echo "**Warning: $loud.** This job is green only because of that override."
                echo "The operator turns it off with \`gh variable delete SWIFT_CI_ALLOW_SDK_DEGRADE\`."
              else
                echo "**This job is red: tests did NOT run.** The operator can set the repository variable \`SWIFT_CI_ALLOW_SDK_DEGRADE\` to \`true\` to turn this into a warning, temporarily."
              fi
              echo
              echo "Nothing to fix in the code. This clears once GitHub ships a macOS runner with a new enough Xcode."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            if [[ "$override" == "true" ]]; then exit 0; fi
            echo "::error::Swift CI failed: tests did NOT run because the runner's macOS $SDK SDK is older than the macOS $MIN_SDK SDK the project needs. The operator can set repo variable SWIFT_CI_ALLOW_SDK_DEGRADE to true to allow this temporarily."
            exit 1
          fi
          echo "::error::Swift build failed on Xcode $XCODE (macOS $SDK SDK). See the log above."
          exit 1

      - name: Run GrowinTests
        id: test
        if: steps.build.outputs.built == 'true'
        run: |
          set +e -uo pipefail  # the runner uses bash -e; keep going to read the status
          unset TEST_RUNNER_GROWIN_SE_UAT
          xcodebuild test-without-building \
            -project Growin.xcodeproj -scheme Growin \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/GrowinTests.xcresult" \
            -only-testing:GrowinTests \
            -skip-testing:GrowinUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Require the Keychain tripwire and canary tests
        id: required
        # Runs whenever the tests were attempted, pass or fail, so a missing
        # test is named even when the test step is red. Not cancelled only.
        if: ${{ !cancelled() && steps.build.outputs.built == 'true' }}
        run: |
          set -uo pipefail
          list=".github/required-swift-tests.txt"
          result="$RUNNER_TEMP/GrowinTests.xcresult"
          fail() { echo "::error::Required Swift tests: $*"; exit 1; }
          [[ -f "$list" ]] || fail "$list is missing."
          [[ -d "$result" ]] || fail "no result bundle at $result, so the tests did not finish and none of the required tests can be confirmed."
          command -v jq >/dev/null || fail "jq is not available on this runner."
          json="$RUNNER_TEMP/required-tests.json"
          xcrun xcresulttool get test-results tests --path "$result" --format json > "$json" \
            || fail "xcresulttool could not read $result."
          # Every Test Case node, with the names of the nodes above it.
          # Swift Testing names a case "function()"; the "()" is dropped.
          jq -c '
            def cases($anc):
              . as $n | ($anc + [$n.name // ""]) as $p
              | if $n.nodeType == "Test Case"
                then {path: $p, result: ($n.result // "unknown")}
                else ($n.children // [])[] | cases($p) end;
            .testNodes[]? | cases([])
          ' "$json" > "$RUNNER_TEMP/required-cases.jsonl" || fail "could not read the test tree in $result."
          total=$(wc -l < "$RUNNER_TEMP/required-cases.jsonl" | tr -d ' ')
          [[ "$total" -gt 0 ]] || fail "the result bundle holds no test cases, so the xcresulttool output format may have changed."
          required=0; bad=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line//$'\r'/}"
            [[ -z "${line//[[:space:]]/}" || "$line" == \#* ]] && continue
            suite="${line%%/*}"; name="${line#*/}"
            if [[ "$suite" == "$line" || -z "$suite" || -z "$name" ]]; then
              echo "::error::Required Swift tests: bad line '$line' in $list (want Suite/testFunction)."; required=$((required+1)); bad=$((bad+1)); continue
            fi
            required=$((required+1))
            results=$(jq -r --arg suite "$suite" --arg name "$name" '
              select((.path | last | sub("\\(\\)$"; "")) == $name and any(.path[:-1][]; . == $suite))
              | .result' "$RUNNER_TEMP/required-cases.jsonl")
            if [[ -z "$results" ]]; then
              echo "::error::Required Swift test $suite/$name did not run: no such test case in the result bundle (deleted, renamed, or compiled out)."; bad=$((bad+1))
            elif grep -qvx 'Passed' <<< "$results"; then
              echo "::error::Required Swift test $suite/$name did not pass: result $(sort -u <<< "$results" | paste -sd, -)."; bad=$((bad+1))
            else
              echo "ok  $suite/$name"
            fi
          done < "$list"
          [[ "$required" -gt 0 ]] || fail "$list names no tests."
          {
            echo
            echo "Required tests: $((required-bad)) of $required ran and passed."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$bad" -eq 0 ]] || exit 1

      - name: Summarise
        if: always() && steps.build.outputs.built == 'true'
        env:
          SDK: ${{ steps.xcode.outputs.sdk }}
          XCODE: ${{ steps.xcode.outputs.app }}
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          {
            echo "## Swift CI: ${OUTCOME}"
            echo
            echo "Xcode \`$XCODE\`, macOS SDK \`$SDK\`. Unit tests: GrowinTests only."
          } >> "$GITHUB_STEP_SUMMARY"
          log="$RUNNER_TEMP/test.log"
          if [[ -f "$log" ]]; then
            passed=$(grep -Eci "^Test case '[^']*' passed" "$log" || true)
            failed=$(grep -Eci "^Test case '[^']*' failed" "$log" || true)
            skipped=$(grep -Eci "^Test case '[^']*' skipped" "$log" || true)
            printf '\nPassed %s · failed %s · skipped %s\n' "$passed" "$failed" "$skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-ci-results
          path: |
            ${{ runner.temp }}/GrowinTests.xcresult
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
          retention-days: 14
          if-no-files-found: ignore
